---
# Push the rendered configuration (nodes/<node>/vyos_config.txt, from lab.conf or Nautobot via tools/render.py) to the VyOS
# nodes — the Ansible equivalent of `./lab.sh configure`. Additive and idempotent (VyOS `set` lines); use --check --diff
# to see what a node is missing before applying. Limit with -l pe1 / -l pe / -l dc3.
- name: Apply the intended configuration to the VyOS nodes
  hosts: vyos
  gather_facts: false
  tasks:
    - name: Read the rendered set commands (comments and blank lines dropped)
      ansible.builtin.set_fact:
        intended_lines: "{{ lookup('ansible.builtin.file', intended_config).splitlines() | select('match', '^set ') | reject('search', 'plaintext-password') | list }}"   # VyOS stores the hash, the plaintext line never matches

    - name: Push them (commit + save); with --check --diff only the missing lines are shown
      vyos.vyos.vyos_config:
        lines: "{{ intended_lines }}"
        match: line
        save: true
        comment: "ansible site.yml"
      register: push
      notify: FRR logging level

    - name: Report
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: {{ 'changed (' ~ (push.commands | default([]) | length) ~ ' lines)' if push.changed else 'in sync' }}"

  handlers:
    - name: FRR logging level   # informational for the routing daemons (see tools/frr_logging.py) — not expressible in the CLI
      ansible.builtin.command: "{{ playbook_dir }}/../tests/.venv/bin/python {{ playbook_dir }}/../tools/frr_logging.py {{ inventory_hostname }}"
      delegate_to: localhost
