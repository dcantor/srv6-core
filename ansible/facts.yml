---
# Structured facts from every VyOS node (version, interfaces, running configuration) into ansible/facts/<node>.json.
- name: Gather VyOS facts
  hosts: vyos
  gather_facts: false
  tasks:
    - name: Facts
      vyos.vyos.vyos_facts:
        gather_subset: [min, config]
        gather_network_resources: [interfaces, l3_interfaces, lldp_global]
      register: f
    - name: Save
      ansible.builtin.copy:
        content: "{{ f.ansible_facts | to_nice_json }}"
        dest: "{{ playbook_dir }}/facts/{{ inventory_hostname }}.json"
      delegate_to: localhost
