! lg: the lab's BGP looking glass — a passive route collector, rendered by tools/render.py
! It peers with every route reflector over its own point-to-point link and receives the whole VPN table with the
! attributes the PEs originated (RD, route targets, SRv6 SID and label, originator, cluster list). It runs no IGP,
! installs nothing in the kernel and announces nothing: COLLECTOR-NO-EXPORT denies everything outbound.
frr defaults traditional
hostname lg
log file /var/log/frr/frr.log informational
log syslog informational
service integrated-vtysh-config
!
router bgp 65000
 bgp router-id 10.255.0.21
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 no bgp network import-check
 bgp graceful-restart
 neighbor fd00:b:0:121::1 remote-as 65000
 neighbor fd00:b:0:121::1 description p1 (route reflector) via eth1
 neighbor fd00:b:0:121::1 capability extended-nexthop
 neighbor fd00:b:0:121::1 timers 10 30
 neighbor fd00:b:0:321::1 remote-as 65000
 neighbor fd00:b:0:321::1 description p3 (route reflector) via eth2
 neighbor fd00:b:0:321::1 capability extended-nexthop
 neighbor fd00:b:0:321::1 timers 10 30
 address-family ipv4 vpn
  neighbor fd00:b:0:121::1 activate
  neighbor fd00:b:0:121::1 soft-reconfiguration inbound
  neighbor fd00:b:0:121::1 route-map COLLECTOR-NO-EXPORT out
  neighbor fd00:b:0:321::1 activate
  neighbor fd00:b:0:321::1 soft-reconfiguration inbound
  neighbor fd00:b:0:321::1 route-map COLLECTOR-NO-EXPORT out
 exit-address-family
 address-family ipv6 vpn
  neighbor fd00:b:0:121::1 activate
  neighbor fd00:b:0:121::1 soft-reconfiguration inbound
  neighbor fd00:b:0:121::1 route-map COLLECTOR-NO-EXPORT out
  neighbor fd00:b:0:321::1 activate
  neighbor fd00:b:0:321::1 soft-reconfiguration inbound
  neighbor fd00:b:0:321::1 route-map COLLECTOR-NO-EXPORT out
 exit-address-family
exit
!
route-map COLLECTOR-NO-EXPORT deny 10
exit
!
