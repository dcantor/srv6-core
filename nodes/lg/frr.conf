! lg: the lab's BGP looking glass, rendered by tools/render.py
! The reflectors stream their tables to lgd over BMP (port 11019): FRR on this VM holds no BGP
! session. Set LG_FEED=session in lab.conf to go back to the iBGP session.
frr defaults traditional
hostname lg
log file /var/log/frr/frr.log informational
log syslog informational
service integrated-vtysh-config
!
