# SRv6 WAN core lab: 4 VyOS PEs (one per data centre), 3 VyOS P routers in a triangle (p1 = route reflector),
# 4 VyOS CEs and 4 CirrOS hosts in VRF tenant-a. IS-IS level-2 IPv6-only underlay, BGP VPNv4 over SRv6 (End.DT4).
LAB_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
LIBVIRT_URI="qemu:///system"

# VyOS base image (built once from the rolling ISO by ../cat8000v-ipsec/tools/vyos_install.py); every VyOS node is an overlay on it.
VYOS_IMAGE="/home/dcantor/cat8000v-ipsec/images/vyos-base.qcow2"
VYOS_VCPU=1
VYOS_RAM_MIB=1024

# CirrOS end hosts (cloud-init NoCloud seed, 256 MiB)
CIRROS_IMAGE="/home/dcantor/cat9000v/images/cirros-0.6.3-x86_64-disk.img"
CIRROS_RAM_MIB=256

# Out-of-band management network (isolated libvirt bridge; the host is the gateway). eth0 on every VM.
OOB_NET="srv6-oob"
OOB_GATEWAY="10.3.0.1"

# Service parameters
CORE_AS=65000            # PEs and the route reflector
RR="p1"                  # VPNv4 route reflector
VRF_NAME="tenant-a"
VRF_TABLE=100
VRF_RT="65000:100"
ISIS_AREA="49.0001"

declare -A ROLE=(        [pe1]=pe [pe2]=pe [pe3]=pe [pe4]=pe [p1]=p [p2]=p [p3]=p [ce1]=ce [ce2]=ce [ce3]=ce [ce4]=ce [host1]=host [host2]=host [host3]=host [host4]=host )
declare -A MGMT_IP=(     [pe1]=10.3.0.11 [pe2]=10.3.0.12 [pe3]=10.3.0.13 [pe4]=10.3.0.14 [p1]=10.3.0.21 [p2]=10.3.0.22 [p3]=10.3.0.23
                         [ce1]=10.3.0.31 [ce2]=10.3.0.32 [ce3]=10.3.0.33 [ce4]=10.3.0.34 [host1]=10.3.0.41 [host2]=10.3.0.42 [host3]=10.3.0.43 [host4]=10.3.0.44 )
declare -A LOOPBACK6=(   [pe1]=fd00:a::1 [pe2]=fd00:a::2 [pe3]=fd00:a::3 [pe4]=fd00:a::4 [p1]=fd00:a::11 [p2]=fd00:a::12 [p3]=fd00:a::13 )
declare -A ROUTER_ID=(   [pe1]=10.255.0.1 [pe2]=10.255.0.2 [pe3]=10.255.0.3 [pe4]=10.255.0.4 [p1]=10.255.0.11 [p2]=10.255.0.12 [p3]=10.255.0.13
                         [ce1]=172.20.1.1 [ce2]=172.20.2.1 [ce3]=172.20.3.1 [ce4]=172.20.4.1 )
declare -A LOCATOR=(     [pe1]=fd00:c:1::/64 [pe2]=fd00:c:2::/64 [pe3]=fd00:c:3::/64 [pe4]=fd00:c:4::/64 [p1]=fd00:c:11::/64 [p2]=fd00:c:12::/64 [p3]=fd00:c:13::/64 )
declare -A ISIS_NET=(    [pe1]=49.0001.0000.0000.0001.00 [pe2]=49.0001.0000.0000.0002.00 [pe3]=49.0001.0000.0000.0003.00 [pe4]=49.0001.0000.0000.0004.00
                         [p1]=49.0001.0000.0000.0011.00 [p2]=49.0001.0000.0000.0012.00 [p3]=49.0001.0000.0000.0013.00 )
declare -A BGP_AS=(      [pe1]=65000 [pe2]=65000 [pe3]=65000 [pe4]=65000 [p1]=65000 [p2]=- [p3]=- [ce1]=65001 [ce2]=65002 [ce3]=65003 [ce4]=65004 [host1]=- [host2]=- [host3]=- [host4]=- )
declare -A DC=(          [pe1]=dc1 [pe2]=dc2 [pe3]=dc3 [pe4]=dc4 [p1]=core [p2]=core [p3]=core [ce1]=dc1 [ce2]=dc2 [ce3]=dc3 [ce4]=dc4 [host1]=dc1 [host2]=dc2 [host3]=dc3 [host4]=dc4 )
declare -A PE_OF=(       [ce1]=pe1 [ce2]=pe2 [ce3]=pe3 [ce4]=pe4 )   # CE -> its PE (the VPN attachment)

# Point-to-point links: "A:portA B:portB prefix". Port N = ethN. The first end takes the first host address (::1 / .1),
# the second end the second (::2 / .2); the first end anchors the UDP socket pair. Core links are /64s from fd00:b::/48,
# PE-CE links /30s from 172.16.0.0/16, CE-host LANs /24s from 172.20.0.0/16 (CE = .1 = the host's gateway).
LINKS=(
  # P triangle
  "p1:1 p2:1 fd00:b:0:12::/64"
  "p1:2 p3:1 fd00:b:0:13::/64"
  "p2:2 p3:2 fd00:b:0:23::/64"
  # PEs dual-homed: pe1/pe2 -> p1+p2, pe3/pe4 -> p2+p3 (every west<->east path crosses p2)
  "p1:3 pe1:1 fd00:b:0:101::/64"
  "p1:4 pe2:1 fd00:b:0:102::/64"
  "p2:3 pe1:2 fd00:b:0:201::/64"
  "p2:4 pe2:2 fd00:b:0:202::/64"
  "p2:5 pe3:1 fd00:b:0:203::/64"
  "p2:6 pe4:1 fd00:b:0:204::/64"
  "p3:3 pe3:2 fd00:b:0:303::/64"
  "p3:4 pe4:2 fd00:b:0:304::/64"
  # PE-CE attachment circuits (VRF tenant-a on the PE side)
  "pe1:3 ce1:1 172.16.1.0/30"
  "pe2:3 ce2:1 172.16.2.0/30"
  "pe3:3 ce3:1 172.16.3.0/30"
  "pe4:3 ce4:1 172.16.4.0/30"
  # data-centre LANs
  "ce1:2 host1:1 172.20.1.0/24"
  "ce2:2 host2:1 172.20.2.0/24"
  "ce3:2 host3:1 172.20.3.0/24"
  "ce4:2 host4:1 172.20.4.0/24"
)

# Serial consoles (raw TCP on 127.0.0.1) and per-node index (drives MAC addresses and UDP ports)
declare -A CONSOLE_PORT=( [pe1]=5301 [pe2]=5302 [pe3]=5303 [pe4]=5304 [p1]=5305 [p2]=5306 [p3]=5307 [ce1]=5308 [ce2]=5309 [ce3]=5310 [ce4]=5311 [host1]=5312 [host2]=5313 [host3]=5314 [host4]=5315 )
declare -A NODE_IDX=(     [pe1]=1 [pe2]=2 [pe3]=3 [pe4]=4 [p1]=5 [p2]=6 [p3]=7 [ce1]=8 [ce2]=9 [ce3]=10 [ce4]=11 [host1]=12 [host2]=13 [host3]=14 [host4]=15 )
MAC_OUI="52:54:00:c6"
UDP_BASE=14000           # local ports 14000+idx*100+port, far side +10000; both below the ephemeral range and clear of the other labs

# Data ports per role (eth1..ethN; unwired ones are still created, black-holed, so adding a link never changes an anchor VM)
PE_PORTS=3               # eth1/eth2 core, eth3 CE
P_PORTS=6
CE_PORTS=2               # eth1 PE, eth2 LAN
HOST_PORTS=1

PES=(pe1 pe2 pe3 pe4)
PS=(p1 p2 p3)
CES=(ce1 ce2 ce3 ce4)
HOSTS=(host1 host2 host3 host4)
VYOS_NODES=("${PES[@]}" "${PS[@]}" "${CES[@]}")
ALL_NODES=("${VYOS_NODES[@]}" "${HOSTS[@]}")
