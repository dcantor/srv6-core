# SRv6 WAN core lab: 4 VyOS PEs (one per data centre), 3 VyOS P routers in a triangle (p1 = route reflector),
# 4 VyOS CEs and two CirrOS hosts per site in two isolated tenants (VRFs tenant-a / tenant-b).
# IS-IS level-2 IPv6-only underlay, BGP VPNv4 over SRv6 (one End.DT4 SID per tenant per PE).
# Plus an internet breakout firewall (fw-inet) and a BGP looking glass (lg): a passive route collector with a history.
LAB_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
LIBVIRT_URI="qemu:///system"

# VyOS base image (built once from the rolling ISO by ../cat8000v-ipsec/tools/vyos_install.py); every VyOS node is an overlay on it.
VYOS_IMAGE="/home/dcantor/cat8000v-ipsec/images/vyos-base.qcow2"
VYOS_VCPU=1
VYOS_RAM_MIB=1024

# Tenant hosts: Alpine Linux with iperf3 / tcpdump / mtr (base image built by tools/build_host_image.sh from the Alpine
# NoCloud cloud-init image; overlays per host, cloud-init NoCloud seed with static addresses; user lab / lab), 256 MiB
HOST_IMAGE="$LAB_DIR/images/alpine-host.qcow2"
HOST_RAM_MIB=256

# Out-of-band management network (isolated libvirt bridge; the host is the gateway). eth0 on every VM.
OOB_NET="srv6-oob"
OOB_GATEWAY="10.3.0.1"

# Service parameters
CORE_AS=65000            # PEs and the route reflector
RRS=(p1 p3)              # VPNv4 route reflectors (every PE peers with both; the VPN survives losing one)
RR="${RRS[0]}"
TENANTS=(tenant-a tenant-b)                                   # one VRF each on every PE; tenant-b is also a VRF on the CE
declare -A VRF_TABLE=( [tenant-a]=100 [tenant-b]=200 )         # kernel table; RD = 65000:<table + pe index>
declare -A VRF_RT=(    [tenant-a]=65000:100 [tenant-b]=65000:200 )
ISIS_AREA="49.0001"

declare -A ROLE=(        [pe1]=pe [pe2]=pe [pe3]=pe [pe4]=pe [p1]=p [p2]=p [p3]=p [ce1]=ce [ce2]=ce [ce3]=ce [ce4]=ce
                         [dc1-h1]=host [dc2-h1]=host [dc3-h1]=host [dc4-h1]=host [dc1-h2]=host [dc2-h2]=host [dc3-h2]=host [dc4-h2]=host )
declare -A MGMT_IP=(     [pe1]=10.3.0.11 [pe2]=10.3.0.12 [pe3]=10.3.0.13 [pe4]=10.3.0.14 [p1]=10.3.0.21 [p2]=10.3.0.22 [p3]=10.3.0.23
                         [ce1]=10.3.0.31 [ce2]=10.3.0.32 [ce3]=10.3.0.33 [ce4]=10.3.0.34
                         [dc1-h1]=10.3.0.41 [dc2-h1]=10.3.0.42 [dc3-h1]=10.3.0.43 [dc4-h1]=10.3.0.44 [dc1-h2]=10.3.0.51 [dc2-h2]=10.3.0.52 [dc3-h2]=10.3.0.53 [dc4-h2]=10.3.0.54 )
declare -A LOOPBACK6=(   [pe1]=fd00:a::1 [pe2]=fd00:a::2 [pe3]=fd00:a::3 [pe4]=fd00:a::4 [p1]=fd00:a::11 [p2]=fd00:a::12 [p3]=fd00:a::13 )
declare -A ROUTER_ID=(   [pe1]=10.255.0.1 [pe2]=10.255.0.2 [pe3]=10.255.0.3 [pe4]=10.255.0.4 [p1]=10.255.0.11 [p2]=10.255.0.12 [p3]=10.255.0.13
                         [ce1]=172.20.1.1 [ce2]=172.20.2.1 [ce3]=172.20.3.1 [ce4]=172.20.4.1 )
# SRv6: uSID (usid-f3216 = block 32 bits, node 16 bits, function 16 bits) — one /48 locator per core node out of the /32 block;
# several micro-SIDs fit in one 128-bit segment, so a steered path is a single address instead of an SRH of N segments
SRV6_BLOCK="fd00:c::/32"
SRV6_FORMAT="usid-f3216"        # or uncompressed-f4024 (block 40 / node 24 / function 16, /64 locators)
declare -A LOCATOR=(     [pe1]=fd00:c:1::/48 [pe2]=fd00:c:2::/48 [pe3]=fd00:c:3::/48 [pe4]=fd00:c:4::/48 [p1]=fd00:c:11::/48 [p2]=fd00:c:12::/48 [p3]=fd00:c:13::/48 )
declare -A ISIS_NET=(    [pe1]=49.0001.0000.0000.0001.00 [pe2]=49.0001.0000.0000.0002.00 [pe3]=49.0001.0000.0000.0003.00 [pe4]=49.0001.0000.0000.0004.00
                         [p1]=49.0001.0000.0000.0011.00 [p2]=49.0001.0000.0000.0012.00 [p3]=49.0001.0000.0000.0013.00 )
declare -A BGP_AS=(      [pe1]=65000 [pe2]=65000 [pe3]=65000 [pe4]=65000 [p1]=65000 [p2]=- [p3]=65000 [ce1]=65001 [ce2]=65002 [ce3]=65003 [ce4]=65004 )
declare -A DC=(          [pe1]=dc1 [pe2]=dc2 [pe3]=dc3 [pe4]=dc4 [p1]=core [p2]=core [p3]=core [ce1]=dc1 [ce2]=dc2 [ce3]=dc3 [ce4]=dc4
                         [dc1-h1]=dc1 [dc2-h1]=dc2 [dc3-h1]=dc3 [dc4-h1]=dc4 [dc1-h2]=dc1 [dc2-h2]=dc2 [dc3-h2]=dc3 [dc4-h2]=dc4 )
declare -A PE_OF=(       [ce1]=pe1 [ce2]=pe2 [ce3]=pe3 [ce4]=pe4 )   # CE -> its PE (the VPN attachment)

# External CEs: another lab's routers attached to a tenant as CEs (no VM and no configuration managed here — only the PE
# side is rendered, the UDP link ports are mirrored from that lab's fixed numbering, and the attachment is modelled in
# Nautobot on the device that lab's seed owns). Currently detached; to attach the cat8000v-ipsec headends again, use:
#   EXT_NODES=(east-headend central-headend west-headend)
#   ROLE+=(    [east-headend]=ext-ce    [central-headend]=ext-ce    [west-headend]=ext-ce )
#   DC+=(      [east-headend]=dc1       [central-headend]=dc2       [west-headend]=dc3 )
#   BGP_AS+=(  [east-headend]=65200     [central-headend]=65204     [west-headend]=65206 )
#   MGMT_IP+=( [east-headend]=10.2.0.11 [central-headend]=10.2.0.15 [west-headend]=10.2.0.17 )
#   PE_OF+=(   [east-headend]=pe1       [central-headend]=pe2       [west-headend]=pe3 )
#   declare -A EXT_IDX=(      [east-headend]=1 [central-headend]=5 [west-headend]=7 )        # NODE_IDX in the IPsec lab
#   declare -A EXT_UDP_BASE=( [east-headend]=22000 [central-headend]=22000 [west-headend]=22000 )
#   declare -A EXT_LAB=(      [east-headend]=/home/dcantor/cat8000v-ipsec [central-headend]=/home/dcantor/cat8000v-ipsec [west-headend]=/home/dcantor/cat8000v-ipsec )
#   and the links "east-headend:3 pe1:5 172.19.1.0/30 tenant-a", "central-headend:3 pe2:5 172.19.2.0/30 tenant-a",
#   "west-headend:3 pe3:5 172.19.3.0/30 tenant-a" (headend Gi3 = first end, .1); then rebuild pe1-3, configure, nautobot seed,
#   and render / apply on the IPsec side.
EXT_NODES=()
declare -A EXT_IDX=() EXT_UDP_BASE=() EXT_LAB=()
EXT_PORTS=3

# Every tenant link (attachment circuit, site LAN) is dual-stack: the IPv6 prefix is derived from the IPv4 one by rule —
# 172.X.Y.0/n -> ${V6_MAP}:X:Y::/64 (172.16.1.0/30 -> fd00:16:1::/64, 172.20.1.0/24 -> fd00:20:1::/64), same host ordinals
# (first end ::1, second ::2). Both appear explicitly in `lab.sh inventory` (ip6 / prefix6); one End.DT46 SID per VRF serves both.
V6_MAP="fd00"
# Internet breakout: a small VyOS firewall (fw-inet) is a CE of *both* tenants on INTERNET_PE (one attachment circuit per tenant,
# each in the tenant's VRF on the firewall too — VRF-lite), announcing nothing but a default route into each; its last port sits on
# the libvirt NAT network INTERNET_NET (DHCP, the host's own uplink) in its default VRF, where outbound tenant traffic is masqueraded.
# The tenants meet only inside the firewall, whose policy allows tenant -> internet and nothing else, so they stay isolated.
# IPv4 only (the host NAT network is IPv4); no shared "internet VRF" in the core (see README: why not RT import/export).
INTERNET_PE="pe4"; INTERNET_FW="fw-inet"; INTERNET_NET="default"; INTERNET_AS=65010
FW_PORTS=2               # eth1 = tenant-a circuit, eth2 = tenant-b circuit; eth3 = the NAT network (NET_PORT)
declare -A NET_PORT=( [fw-inet]="3:default" )   # node -> "ethN:libvirt network": an extra NIC on a libvirt network instead of a UDP link
declare -A NODE_RAM_MIB=()                     # per-node RAM override (MiB); the firewall needs the full VYOS_RAM_MIB — 512 thrashes
ROLE+=( [fw-inet]=fw ); DC+=( [fw-inet]=dc4 ); MGMT_IP+=( [fw-inet]=10.3.0.61 ); BGP_AS+=( [fw-inet]=65010 ); PE_OF+=( [fw-inet]=pe4 )
ROUTER_ID+=( [fw-inet]=10.3.0.61 )     # the firewall's BGP router-id is its OOB address (what tools/render.py gives it, and what Nautobot holds)
# Extra loopbacks on every CE: CE_LOOPBACKS addresses per CE per tenant listed in CE_LOOPBACK_TENANTS, on a dummy
# interface inside that tenant's VRF and announced by the CE's eBGP session (one `network` statement each), so they
# travel the same way a site LAN does — eBGP to the PE, VPN route with the PE's End.DT46 SID, imported everywhere.
# Addressing follows the same rule as the rest of the tenant space (tenant i -> 172.(16+i) circuits, 172.(20+i) LANs):
# 172.(24+i).<site>.<n>/32, so ce3's third tenant-a loopback is 172.24.3.3/32 and the site is readable at a glance.
CE_LOOPBACKS=10
CE_LOOPBACK_TENANTS=(tenant-a)          # add tenant-b here to give the second tenant the same set
CE_LOOPBACK_BASE=24                     # the second octet of tenant i's loopback /16 (24 + i)

# BGP looking glass (lg): a small Alpine VM in the core running FRR as a **passive route collector** — an iBGP session to
# every route reflector over its own direct link, so it receives the whole VPNv4 / VPNv6 table with the attributes the PEs
# sent (RD, route targets, SRv6 SID, label, originator, cluster list) and the PE loopback still as the next hop
# (`capability extended-nexthop`: over an IPv4 or plain session FRR rewrites it to its own address). It announces nothing.
# On top of that RIB it keeps a history in SQLite and serves the looking-glass web UI / API on LG_PORT. It also polls the
# PEs' and CEs' per-VRF unicast tables over SSH, which the core's VPN tables cannot show (the post-import tenant view).
LG_IMAGE="$LAB_DIR/images/lg.qcow2"    # built by tools/build_lg_image.sh (Alpine + FRR + Flask); overlay per VM like the hosts
LG_RAM_MIB=512
LG_PORTS=2               # eth1 -> p1, eth2 -> p3 (one link per reflector: losing a reflector does not blind the collector)
LG_PORT=8080             # the looking glass itself (web UI + API); reachable from the host, relayed to the LAN
LG_USER=lab; LG_PASS=lab
ROLE+=( [lg]=lg ); DC+=( [lg]=core ); MGMT_IP+=( [lg]=10.3.0.70 ); BGP_AS+=( [lg]=65000 ); ROUTER_ID+=( [lg]=10.255.0.21 )
LGS=(lg)

# Point-to-point links: "A:portA B:portB prefix [tenant]". Port N = ethN. The first end takes the first host address
# (::1 / .1), the second end the second (::2 / .2); the first end anchors the UDP socket pair. Core links are /64s from
# fd00:b::/48. Access links carry the tenant they belong to: PE-CE /30s from 172.16.0.0/16 (tenant-a) and 172.18.0.0/16
# (tenant-b), CE-host LANs /24s from 172.20.0.0/16 (tenant-a) and 172.21.0.0/16 (tenant-b); the CE is .1 = the host's gateway.
LINKS=(
  # P triangle
  "p1:1 p2:1 fd00:b:0:12::/64"
  "p1:2 p3:1 fd00:b:0:13::/64"
  "p2:2 p3:2 fd00:b:0:23::/64"
  # PEs dual-homed: pe1/pe2 -> p1+p2, pe3/pe4 -> p2+p3 (every west<->east path crosses p2)
  "p1:3 pe1:1 fd00:b:0:101::/64"
  "p1:4 pe2:1 fd00:b:0:102::/64"
  "p2:3 pe1:2 fd00:b:0:201::/64"
  "p2:4 pe2:2 fd00:b:0:202::/64"
  "p2:5 pe3:1 fd00:b:0:203::/64"
  "p2:6 pe4:1 fd00:b:0:204::/64"
  "p3:3 pe3:2 fd00:b:0:303::/64"
  "p3:4 pe4:2 fd00:b:0:304::/64"
  # PE-CE attachment circuits, one per tenant (VRF on the PE; tenant-b is also a VRF on the CE)
  "pe1:3 ce1:1 172.16.1.0/30 tenant-a"
  "pe2:3 ce2:1 172.16.2.0/30 tenant-a"
  "pe3:3 ce3:1 172.16.3.0/30 tenant-a"
  "pe4:3 ce4:1 172.16.4.0/30 tenant-a"
  "pe1:4 ce1:3 172.18.1.0/30 tenant-b"
  "pe2:4 ce2:3 172.18.2.0/30 tenant-b"
  "pe3:4 ce3:3 172.18.3.0/30 tenant-b"
  "pe4:4 ce4:3 172.18.4.0/30 tenant-b"
  # data-centre LANs: h1 in tenant-a, h2 in tenant-b
  "ce1:2 dc1-h1:1 172.20.1.0/24 tenant-a"
  "ce2:2 dc2-h1:1 172.20.2.0/24 tenant-a"
  "ce3:2 dc3-h1:1 172.20.3.0/24 tenant-a"
  "ce4:2 dc4-h1:1 172.20.4.0/24 tenant-a"
  "ce1:4 dc1-h2:1 172.21.1.0/24 tenant-b"
  "ce2:4 dc2-h2:1 172.21.2.0/24 tenant-b"
  "ce3:4 dc3-h2:1 172.21.3.0/24 tenant-b"
  "ce4:4 dc4-h2:1 172.21.4.0/24 tenant-b"
  # internet breakout: the firewall is a CE of both tenants on pe4 (circuit 5 of each tenant block; IPv4 only)
  "pe4:5 fw-inet:1 172.16.5.0/30 tenant-a"
  "pe4:6 fw-inet:2 172.18.5.0/30 tenant-b"
  # the looking-glass collector: one link to each route reflector (the P router is the first end, so its NIC keeps the UDP
  # ports it already had when the port was unwired — p1 / p3 never need a rebuild, only the address and the neighbour)
  "p1:5 lg:1 fd00:b:0:121::/64"
  "p3:5 lg:2 fd00:b:0:321::/64"
)

# Serial consoles (raw TCP on 127.0.0.1) and per-node index (drives MAC addresses and UDP ports)
declare -A CONSOLE_PORT=( [pe1]=5301 [pe2]=5302 [pe3]=5303 [pe4]=5304 [p1]=5305 [p2]=5306 [p3]=5307 [ce1]=5308 [ce2]=5309 [ce3]=5310 [ce4]=5311
                          [dc1-h1]=5312 [dc2-h1]=5313 [dc3-h1]=5314 [dc4-h1]=5315 [dc1-h2]=5316 [dc2-h2]=5317 [dc3-h2]=5318 [dc4-h2]=5319 )
declare -A NODE_IDX=(     [pe1]=1 [pe2]=2 [pe3]=3 [pe4]=4 [p1]=5 [p2]=6 [p3]=7 [ce1]=8 [ce2]=9 [ce3]=10 [ce4]=11
                          [dc1-h1]=12 [dc2-h1]=13 [dc3-h1]=14 [dc4-h1]=15 [dc1-h2]=16 [dc2-h2]=17 [dc3-h2]=18 [dc4-h2]=19 )
MAC_OUI="52:54:00:c6"
UDP_BASE=14000           # local ports 14000+idx*100+port, far side +10000; both below the ephemeral range and clear of the other labs

# Data ports per role (eth1..ethN; unwired ones are still created, black-holed, so adding a link never changes an anchor VM)
PE_PORTS=6               # eth1/eth2 core, eth3 CE (tenant-a), eth4 CE (tenant-b), eth5/eth6 spare for two more tenants
P_PORTS=6
CE_PORTS=8               # per tenant: PE-facing + LAN — eth1/eth2 tenant-a, eth3/eth4 tenant-b, eth5..eth8 spare for two more tenants
HOST_PORTS=1

PES=(pe1 pe2 pe3 pe4)
PS=(p1 p2 p3)
CES=(ce1 ce2 ce3 ce4)
HOSTS=(dc1-h1 dc2-h1 dc3-h1 dc4-h1 dc1-h2 dc2-h2 dc3-h2 dc4-h2)
FWS=(fw-inet)
CONSOLE_PORT+=( [fw-inet]=5320 ); NODE_IDX+=( [fw-inet]=20 )
CONSOLE_PORT+=( [lg]=5321 );      NODE_IDX+=( [lg]=21 )        # the collector is node 21: its links are fd00:b:0:<p><21>::/64
VYOS_NODES=("${PES[@]}" "${PS[@]}" "${CES[@]}" "${FWS[@]}")
ALL_NODES=("${VYOS_NODES[@]}" "${HOSTS[@]}" "${LGS[@]}")
